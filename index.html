<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101316" />
    <title>毎秒カウント</title>
    <link rel="manifest" href="./manifest.webmanifest?v=4" />
    <link rel="stylesheet" href="./styles.css?v=4" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Web Audio / VOICEVOX ready</p>
          <h1>毎秒カウント</h1>
        </div>
        <a class="tool-link" href="./voice-pack-maker.html">音声パック作成</a>
      </header>

      <section class="counter-panel" aria-label="カウント操作">
        <div class="readout">
          <span id="modeLabel">カウントアップ</span>
          <strong id="countDisplay">0</strong>
          <span id="unitLabel">秒</span>
        </div>

        <div class="primary-actions">
          <button id="startBtn" class="primary">開始</button>
          <button id="pauseBtn">一時停止</button>
          <button id="resetBtn">リセット</button>
        </div>
      </section>

      <section class="settings-grid" aria-label="設定">
        <div class="setting">
          <label for="mode">モード</label>
          <select id="mode">
            <option value="up">カウントアップ</option>
            <option value="down">カウントダウン</option>
          </select>
        </div>

        <div class="setting">
          <label for="targetSeconds">秒数</label>
          <input id="targetSeconds" type="number" min="1" max="86400" value="60" />
        </div>

        <div class="setting">
          <label for="intervalSeconds">読み上げ間隔</label>
          <select id="intervalSeconds">
            <option value="1">毎秒</option>
            <option value="5">5秒ごと</option>
            <option value="10">10秒ごと</option>
            <option value="60">1分ごと</option>
          </select>
        </div>

        <div class="setting">
          <label for="audioSource">音声</label>
          <select id="audioSource">
            <option value="pack">音声パック</option>
            <option value="voicevox">VOICEVOXローカル</option>
            <option value="browser">ブラウザ音声</option>
            <option value="silent">音なし</option>
          </select>
        </div>
      </section>

      <section class="voice-card" aria-label="音声パック">
        <div>
          <h2>音声パック</h2>
          <p id="packStatus">音声パックは未読込です。VOICEVOXで作った .ponvoice を取り込めます。</p>
        </div>
        <div class="file-row">
          <label class="file-button" for="packInput">取り込む</label>
          <input id="packInput" type="file" accept=".ponvoice,.PONVOICE,application/json" />
          <button id="clearPackBtn">削除</button>
          <button id="testVoiceBtn">試聴</button>
        </div>
      </section>

      <section class="voice-card" aria-label="VOICEVOX接続">
        <div>
          <h2>VOICEVOXローカル</h2>
          <p id="voicevoxStatus">PCでVOICEVOX Engineを起動してから接続します。</p>
        </div>
        <div class="voicevox-row">
          <input id="engineUrl" type="url" value="http://127.0.0.1:50021" aria-label="VOICEVOX Engine URL" />
          <button id="connectBtn">接続</button>
        </div>
        <div class="voicevox-row">
          <select id="speakerSelect" aria-label="話者"></select>
          <button id="prepareBtn">標準音声を準備</button>
        </div>
        <progress id="prepareProgress" value="0" max="75"></progress>
      </section>

      <section class="notes">
        <h2>使い方</h2>
        <p>安定した毎秒カウントのため、音声は先に作って保存します。スマホでは音声パックを取り込む方式が一番安定します。</p>
        <p class="credit">VOICEVOXを使う場合は、公開や配布時に各音声ライブラリの利用規約を確認し、必要なクレジットを表示してください。</p>
      </section>
    </main>

    <script src="./app.js?v=4" type="module"></script>
  </body>
</html>
