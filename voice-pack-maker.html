<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>音声パック作成</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">VOICEVOX Engine</p>
          <h1>音声パック作成</h1>
        </div>
        <a class="tool-link" href="./index.html">カウントへ戻る</a>
      </header>

      <section class="voice-card">
        <div>
          <h2>接続</h2>
          <p id="status">VOICEVOXを起動してから接続してください。</p>
        </div>
        <div class="voicevox-row">
          <input id="engineUrl" type="url" value="http://127.0.0.1:50021" />
          <button id="connectBtn">接続</button>
        </div>
      </section>

      <section class="settings-grid">
        <div class="setting">
          <label for="speakerSelect">話者</label>
          <select id="speakerSelect"></select>
        </div>
        <div class="setting">
          <label for="packSize">パック</label>
          <select id="packSize">
            <option value="core">core 最初の1分</option>
            <option value="standard" selected>standard 1時間分</option>
            <option value="full">full 24時間分</option>
          </select>
        </div>
        <div class="setting">
          <label for="speedScale">読み上げ速度</label>
          <input id="speedScale" type="number" min="0.5" max="2" step="0.05" value="1.35" />
        </div>
        <div class="setting">
          <label for="fileName">ファイル名</label>
          <input id="fileName" value="poncount__voicevox__standard__v01.ponvoice" />
        </div>
      </section>

      <section class="counter-panel">
        <div class="primary-actions">
          <button id="createBtn" class="primary">作成して保存</button>
          <button id="testBtn">1を試聴</button>
          <button id="stopBtn">停止</button>
        </div>
        <progress id="progress" value="0" max="59"></progress>
        <p id="progressText">未作成です。</p>
      </section>

      <section class="notes">
        <h2>クレジット</h2>
        <p>VOICEVOX音声を使う場合、配布や公開の形に応じて利用規約と各キャラクターの表記を確認してください。</p>
      </section>
    </main>

    <script type="module" src="./voice-pack-maker.js"></script>
  </body>
</html>
